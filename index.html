<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#20283c;background:#f5f6fa;font-size:14px;line-height:1.65;color-scheme:light}
*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button,a,summary,select,input{touch-action:manipulation}button,select{cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #8d7de7;outline-offset:3px}
header{background:#fff;border-bottom:1px solid #e4e6ef;padding:20px 5%;display:flex;align-items:center;gap:14px}
.logo{background:#6850c7;color:#fff;width:36px;height:36px;display:grid;place-items:center;border-radius:11px;font-weight:700}
.brand{font-weight:700}.brand small{display:block;font-weight:400;color:#737b8c;font-size:11px;letter-spacing:2px}
main{max-width:1440px;margin:auto;padding:36px 28px 60px}
.eyebrow{font-size:11px;letter-spacing:2px;color:#7665ab;font-weight:600}
h1{font-size:30px;margin:7px 0 12px;letter-spacing:-1px}h2{font-size:20px;margin:0}h3{font-size:16px;margin:0}.muted{color:#72798a}
.panel{background:#fff;border:1px solid #e2e5ee;border-radius:14px;padding:16px 20px;margin:18px 0}
.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.controls label,.field{font-size:12px;color:#667085;display:flex;flex-direction:column;gap:6px}
select,input[type=search],input[type=date]{border:1px solid #dfe2eb;background:#fff;color:#273048;border-radius:9px;padding:8px 12px;max-width:100%;min-width:140px}
select{padding-right:32px}input[type=search]{min-width:220px}
.seg{display:inline-flex;border:1px solid #dfe2eb;border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:8px 14px;color:#4b5468;border-right:1px solid #dfe2eb}.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:#6850c7;color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid #d9d3ec;background:#fff;color:#5d4a99;border-radius:999px;padding:3px 12px;font-size:12px}
.chip[aria-pressed="true"]{background:#6850c7;border-color:#6850c7;color:#fff}.chip small{opacity:.7;margin-left:4px}
.chip.mini{padding:0 8px;font-size:11px;line-height:1.7}
.ext-links{display:inline-flex;gap:12px;flex-wrap:wrap;margin-left:auto;font-size:12px}.ext-links a{color:#5f6b82;text-decoration:none;border-bottom:1px solid #c9ceda}.ext-links a:hover{color:#6850c7;border-color:#6850c7}
.list-table .ext-links{margin:4px 0 0;display:flex}
.linkbtn{border:0;background:transparent;color:#6850c7;padding:6px}
.filter-title{font-size:12px;color:#667085;margin-right:4px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 0}
.badge{border-radius:5px;padding:2px 7px;font-size:11px;white-space:nowrap}
.published{color:#256650;background:#e8f4ed}.pending{color:#95611e;background:#fbf0da}.na{color:#747d8c;background:#eef0f4}.unknown{color:#705a9b;background:#f0eaf8}
.count{color:#7c8391;font-size:12px}#count{margin:14px 0 0}
.group-section{margin-top:40px}.group-title{border-bottom:2px solid #ded7ef;padding-bottom:12px;margin-bottom:22px;display:flex;align-items:baseline;gap:12px}
.group-title .count{font-weight:400}.group-desc{font-size:12px;color:#7c8391;margin:-14px 0 18px}
.event-block{margin:24px 0 36px}.event-heading{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.event-heading h3{font-size:18px}.event-heading time{color:#737b8c;font-size:13px}
.event-subtitle{font-size:12px;color:#7c8391;margin:-6px 0 14px}
.video-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.video-card{background:#fff;border:1px solid #e2e5ee;border-radius:12px;overflow:hidden;min-width:0}
.video-info{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.video-info h4{font-size:14px;margin:0}
.note{font-size:12px;color:#747b8c}.video-card .note{margin:0;padding:0 14px 12px}
.thumb{aspect-ratio:16/9;background:linear-gradient(125deg,#ece9f5,#eef1f8);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8d88a0;gap:9px;overflow:hidden}
.thumb svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.4}.thumb span{font-size:10px;letter-spacing:1.5px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb[href]{text-decoration:none}.thumb[href]:hover{opacity:.88}
details{border-top:1px solid #edf0f5;margin-top:16px;padding-top:10px;font-size:12px}summary{cursor:pointer;color:#7a6b99;width:fit-content}
dl{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:12px}dt{color:#7e8594}dd{margin:0;overflow-wrap:anywhere}.event-details{max-width:720px}
.empty{padding:45px 0;color:#7c8391}
/* 小さいサムネイル */
.compact .video-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.compact .event-block{margin:16px 0 24px}
.compact .event-heading h3{font-size:15px}.compact .video-info{padding:8px 10px}.compact .video-info h4{font-size:12px}
.compact .video-card .note,.compact .thumb svg,.compact .thumb span{display:none}
/* リスト */
.list-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e2e5ee;border-radius:12px;overflow:hidden}
.list-table th{font-size:11px;color:#7c8391;text-align:left;font-weight:600;padding:8px 12px;background:#faf9fd;border-bottom:1px solid #e9ebf3;white-space:nowrap}
.list-table td{padding:8px 12px;border-bottom:1px solid #f0f2f7;vertical-align:middle;font-size:13px}.list-table tr:last-child td{border-bottom:0}
.list-table .thumb{width:112px;border-radius:6px}.list-table .thumb svg{width:20px;height:20px}.list-table .thumb span{display:none}
.list-table .nowrap{white-space:nowrap}.list-table .sub{font-size:11px;color:#8a91a0}
.list-table .tags{display:flex;gap:6px;flex-wrap:wrap}
/* 投稿状況表 */
.matrix-wrap{overflow-x:auto;border:1px solid #e2e5ee;border-radius:12px;background:#fff}
.matrix{width:100%;border-collapse:collapse;min-width:760px}
.matrix th{position:sticky;top:0;background:#faf9fd;font-size:11px;color:#6d7686;font-weight:600;padding:8px 8px;border-bottom:1px solid #e9ebf3;text-align:center;white-space:nowrap}
.matrix th.left{text-align:left}
.matrix td{padding:7px 8px;border-bottom:1px solid #f0f2f7;vertical-align:middle;text-align:center;font-size:12px}
.matrix tr:last-child td{border-bottom:0}.matrix td.left{text-align:left}
.matrix tbody tr:hover{background:#faf9ff}.matrix tr.done td{opacity:.62}

  if(EDITOR){const td7=node('td','','hide-m');const w=node('div','','tags');if(r.ed){if(r.ed.id)w.append(copyBtn(r.ed.id));w.append(node('span','サムネ '+r.ed.thumbs.length,'badge '+(r.ed.thumbs.length?'published':'pending')));if(r.kind==='イベント'){const f=r.ed.footage;w.append(f.length?(f.some(x=>x.ok===false)?node('span','素材なし','badge pending'):f.every(x=>x.ok===true)?node('span','素材あり','badge published'):node('span','素材未検査','badge unknown')):node('span','素材未設定','badge na'))}}td7.append(w);tr.append(td7)}body.append(tr)}
 t.append(body);return t}
const MX_COLS=[['にっぽんワチャチャ','ワチャチャ'],['ミニワチャ','ミニワチャ'],['7テンフィーバーズ！','7テン'],['THE POWER','ザパワ'],['出演者未記載（talk）','トーク'],['その他出演・企画','その他'],['アプネット','アプネット'],['未分類','未分類']];
function mxInfo(entries){ // 1つのセル(出演グループ)の投稿状況をまとめる
 if(!entries.length)return null;const s=entries[0].status,np=(s.match(/🔵/g)||[]).length,nt=(s.match(/❌/g)||[]).length;
 const cls=np&&nt?'partial':np?'published':nt?'pending':s.includes('🍐')?'na':'unknown';
 const text=np&&nt?'一部投稿 '+np+'/'+(np+nt):np?'投稿済み':nt?'未投稿':s.includes('🍐')?'–':'?';
 const n=np&&nt?0:np>1?np:nt>1?nt:0;const detail=s.replace(/🔵|❌️?|🍐/g,'').replace(/\s*,\s*/g,', ').replace(/^\?$/,'').trim();
 return {cls,text:text+(n?'×'+n:''),title:np+nt>1?(detail?'出演者・企画 '+(np+nt)+' 件':'同じイベントで '+(np+nt)+' 回出演')+'(投稿済み '+np+' / 未投稿 '+nt+')':'',detail,ids:entries.map(e=>e.videoId).filter(Boolean),np,nt,posted:np>0,todo:nt>0,na:cls==='na'}}
function matrixTable(items){
 const all=items.map(x=>x.r);const used=new Set(all.flatMap(r=>r.entries.map(e=>e.idol)));
 const cols=MX_COLS.filter(([k],i)=>(i<6||used.has(k))&&(!state.artist||k===state.artist));
 const wrap=node('div','','matrix-wrap'),t=node('table','','matrix');
 const hr=node('tr');hr.append(node('th','日付','left'),node('th','イベント','left'),...cols.map(c=>node('th',c[1])),node('th','進捗'));
 const thead=node('thead');thead.append(hr);t.replaceChildren(thead);
 const tb=node('tbody'),tot=cols.map(()=>({p:0,t:0}));
 for(const r of all){
  const tr=node('tr');const infos=cols.map(c=>mxInfo(r.entries.filter(e=>e.idol===c[0])));
  const total=infos.reduce((a,i)=>a+(i?i.np+i.nt:0),0),done=infos.reduce((a,i)=>a+(i?i.np:0),0);
  tr.className=total&&done===total?'done':'';
  tr.append(node('td',r.date||'—','left'));const ev=node('td','','left ev');const ttl=node('div','','t');ttl.textContent=r.title+(r.edition?' · '+r.edition:'');ev.append(ttl);if(r.series&&r.series.length)ev.append(seriesChips(r));tr.append(ev);
  infos.forEach((i,k)=>{const td=node('td');if(!i){td.append(node('span','','mx na'))}else{const pill=node('span',i.text,'mx '+i.cls);if(i.title)pill.title=i.title;td.append(pill);if(i.ids.length){const l=node('span','','mx-links');i.ids.forEach(id=>{const a=node('a','▶');a.href='https://www.youtube.com/watch?v='+id;a.target='_blank';a.rel='noopener noreferrer';a.title='YouTube で見る';l.append(a)});td.append(l)}if(i.detail)td.append(node('span',i.detail,'mx-detail'));tot[k].p+=i.np;tot[k].t+=i.nt}tr.append(td)});
  tr.append(node('td',total?done+' / '+total:'—','prog '+(total&&done===total?'full':total?'part':'')));tb.append(tr)}
 t.append(tb);
 const tf=node('tfoot'),fr=node('tr');fr.append(node('td','','left'),node('td','合計(出番の数: 投稿済み / 未投稿)','left'),...tot.map(x=>node('td',x.p+' / '+x.t)),node('td',''));tf.append(fr);t.append(tf);
 wrap.append(t);return wrap}
function section(title,items,desc){
 if(!items.length)return;const s=node('section','','group-section');const h=node('h2','','group-title');h.append(node('span',title),node('span',items.length+'件','count'));s.append(h);
 if(desc)s.append(node('p',desc,'group-desc'));
 if(state.view==='matrix')s.append(matrixTable(items));else if(state.view==='list')s.append(listTable(items));else items.forEach(x=>s.append(eventBlock(x)));
 $('results').append(s)}

/* ---- 描画 ---- */
function renderControls(all){
 $('view').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===state.view)));
 for(const k of SEL)if($(k).value!==state[k])$(k).value=state[k];
 const kb=$('kinds');kb.replaceChildren();for(const [k,l] of KINDS){const b=node('button',l,'chip');b.type='button';b.setAttribute('aria-pressed',String(state.kinds.includes(k)));b.addEventListener('click',()=>{state.kinds=state.kinds.includes(k)?state.kinds.filter(x=>x!==k):[...state.kinds,k];render()});kb.append(b)}
 const sb=$('series');sb.replaceChildren(node('span','シリーズ','filter-title'));
 for(const n of [...seriesList.map(s=>s.name),NOSERIES]){const c=all.filter(r=>seriesOf(r).includes(n)).length;if(!c&&!state.series.includes(n))continue;const b=node('button',n,'chip');b.type='button';b.setAttribute('aria-pressed',String(state.series.includes(n)));const sm=node('small',String(c));b.append(sm);b.addEventListener('click',()=>{state.series=state.series.includes(n)?state.series.filter(x=>x!==n):[...state.series,n];render()});sb.append(b)}
 if(state.series.length){const b=node('button','選択を解除','linkbtn');b.type='button';b.addEventListener('click',()=>{state.series=[];render()});sb.append(b)}}
function render(){
 const forSeries=data.filter(r=>passes(r,'series'));
 const base=data.filter(r=>passes(r,'date'));
 renderControls(forSeries);drawCalendar(base);
 const rows=base.filter(r=>!state.date||r.date===state.date).sort(cmp);
 $('results').replaceChildren();
 const events=rows.filter(r=>r.kind==='イベント');
 for(const g of groupEvents(events))section(g.title,g.items,g.desc);
 for(const [kind,title] of [['日付確認中','日付確認中'],['新曲','新曲'],['その他','その他の記録']]){const rs=rows.filter(r=>r.kind===kind);section(title,rs.map(r=>({r,entries:visibleEntries(r)})))}
 document.querySelector('main').classList.toggle('compact',state.view==='compact');
 const n=k=>rows.filter(r=>KIND_OF[r.kind]===k).length,vids=rows.reduce((a,r)=>a+visibleEntries(r).filter(e=>e.videoId).length,0);
 $('count').textContent='表示中: イベント '+n('イベント')+' / 新曲 '+n('新曲')+' / その他 '+n('その他')+' · 動画リンク '+vids+'本';
 if(!rows.length)$('results').append(node('p','この条件に該当する記録はありません。','empty'));
 save()}

/* ---- カレンダー ---- */
const CAL_KIND=r=>r.kind==='イベント'||r.kind==='その他'; // カレンダーに出す記録(日付のあるイベントと「その他」)
const yearSelect=$('calendar-year');
[...new Set(data.filter(r=>CAL_KIND(r)&&r.date).map(r=>r.date.slice(0,4)))].sort().reverse().forEach(y=>{const o=node('option',y+'年');o.value=y;yearSelect.append(o)});
function drawCalendar(rows){
 const year=Number(yearSelect.value),grid=$('calendar');grid.replaceChildren();
 const events=rows.filter(r=>CAL_KIND(r)&&r.date.startsWith(String(year)));
 const counts={};events.forEach(r=>{(counts[r.date]??=[]).push(r)});
 const start=new Date(Date.UTC(year,0,1));start.setUTCDate(start.getUTCDate()-start.getUTCDay());
 const end=new Date(Date.UTC(year,11,31));let lastMonth=-1;
 for(let week=0;week<54;week++){
  const ws=new Date(start);ws.setUTCDate(start.getUTCDate()+week*7);if(ws>end)break;
  const label=node('span','','month');const next=new Date(ws);next.setUTCDate(next.getUTCDate()+6);if(next.getUTCFullYear()===year&&next.getUTCMonth()!==lastMonth){lastMonth=next.getUTCMonth();label.textContent=(lastMonth+1)+'月'}grid.append(label);
  for(let day=0;day<7;day++){const d=new Date(ws);d.setUTCDate(d.getUTCDate()+day);if(d.getUTCFullYear()!==year){grid.append(node('span'));continue}
   const date=d.toISOString().slice(0,10).replaceAll('-','/'),n=(counts[date]||[]).length;const b=node('button','','day');b.type='button';b.dataset.level=String(Math.min(n,4));b.title=date+' · '+n+'件';
   b.setAttribute('aria-label',date+' '+['日','月','火','水','木','金','土'][day]+'曜日 · '+n+'件');b.setAttribute('aria-pressed',String(state.date===date));
   b.addEventListener('click',()=>{state.date=state.date===date?'':date;render()});grid.append(b)}}
 $('calendar-detail').textContent=state.date?state.date+' · '+(counts[state.date]||[]).length+'件':year+'年 · '+events.length+'件 / '+Object.keys(counts).length+'日';
 $('calendar-clear').hidden=!state.date}

/* ---- イベント登録 ---- */
for(const a of ARTISTS){const o=node('option',idolName(a));o.value=a;$('artist').append(o)}
$('artist').prepend(Object.assign(node('option','すべてのアイドル'),{value:''}));
$('view').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.v;render()}));
for(const k of SEL.filter(x=>x!=='q'))$(k).addEventListener('change',()=>{state[k]=$(k).value;render()});
$('q').addEventListener('input',()=>{state.q=$('q').value.trim();render()});
yearSelect.addEventListener('change',()=>{state.date='';render()});$('calendar-clear').addEventListener('click',()=>{state.date='';render()});
$('reset').addEventListener('click',()=>{state={...DEFAULTS,series:[],kinds:[...DEFAULTS.kinds],view:state.view,group:state.group,sort:state.sort};render()});
if(EDITOR){document.body.classList.add('editor');$('mode-tag').hidden=false;$('mode-link').hidden=false;document.title+='（編集者用）';
 const rn=$('roots-note');rn.hidden=false;rn.append(node('h2','置き場所の状態','',),...[]);rn.firstChild.style.fontSize='14px';const lst=node('div','','roots-list');
 for(const [k,v] of Object.entries(ROOTS)){const row=node('div','','path-row');row.append(node('span',({video:'動画',photo:'写真',thumb:'サムネ'}[k]||k),'path-label'),node('code',v.path,'path'),v.ok===true?node('span','検査済み','badge published'):node('span','未検査（未マウントまたは権限なし）','badge unknown'));lst.append(row)}
 rn.append(lst,node('p','パスの「あり/なし」は生成時(build.py 実行時)の結果です。「開く」は file:// のリンクで、ブラウザやOSの設定によっては開けません。','calendar-note'))}
else{$('ed-wrap').remove();$('mode-link').remove()}
load();if(state.date)yearSelect.value=state.date.slice(0,4);render();
</script></body></html>
